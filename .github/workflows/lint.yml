name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Syntax & style (PHP 8.2)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Audits outbound network traffic from the runner. This repo publishes
      # code that installs itself onto other people's helpdesks, so knowing
      # exactly what a build talks to is worth the ten seconds.
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # Every action is pinned to a full commit SHA: tags are mutable and can
      # be silently repointed by their owner. Dependabot updates the SHA and
      # the comment together.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Style/syntax checks run on a single PHP version by design -- the
      # PHP 7.4/8.2 compatibility matrix is already covered by tests.yml.
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # Providers/ references App\* and Illuminate\* classes that only exist
      # inside a booted FreeScout install, so it can never be autoloaded
      # here. php -l checks it is valid PHP without loading anything.
      - name: Lint PHP syntax (php -l)
        run: |
          set -e
          git ls-files -- '*.php' | while read -r file; do
            php -l "$file"
          done

      # Ruleset lives in phpcs.xml (PSR-12, with a documented, narrow
      # exclusion for PHPUnit's snake_case test method convention, and for
      # Blade templates which are not standalone-valid PHP).
      - name: PHP_CodeSniffer (PSR-12)
        run: vendor/bin/phpcs

      - name: Validate composer.json
        run: composer validate --strict

      # A workflow file that does not parse produces a zero-second failed
      # run with no jobs and no log, which is a miserable thing to debug.
      - name: Validate workflow YAML
        run: |
          python3 - <<'PY'
          import sys, pathlib, yaml
          failed = False
          for path in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              try:
                  yaml.safe_load(path.read_text())
              except yaml.YAMLError as exc:
                  failed = True
                  print(f"::error file={path}::{exc}")
          sys.exit(1 if failed else 0)
          PY
