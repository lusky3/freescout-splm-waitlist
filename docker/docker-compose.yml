# ⚠️  LOCAL DEVELOPMENT / TESTING ONLY — DO NOT USE FOR STAGING OR PRODUCTION ⚠️
#
# Adapted from freescout-module-manager/docker/docker-compose.yml. See that
# file for the full rationale (weak throwaway credentials, the chmod
# workaround, the circular bind-mount guard) — unchanged here except for
# this module's own name and mount path.

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: freescout_root
      MYSQL_DATABASE: freescout
      MYSQL_USER: freescout
      MYSQL_PASSWORD: freescout
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:33062:3306"

  app:
    build:
      context: ./php
    volumes:
      - ./freescout:/var/www/html
      - ../:/var/www/html/Modules/SplmWaitlist
      - module_repo_docker_dir_excluded:/var/www/html/Modules/SplmWaitlist/docker
    working_dir: /var/www/html
    command: ["sh", "-c", "chmod -R 777 storage bootstrap/cache Modules && php-fpm"]
    depends_on:
      - db

  web:
    image: nginx:1.25-alpine
    volumes:
      - ./freescout:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - app

volumes:
  db_data:
  module_repo_docker_dir_excluded:
